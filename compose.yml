services:
  db:
    image: postgres:18-alpine
    container_name: cardiologia-hgsm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardiologia_hgsm}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cardiologia_hgsm}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
