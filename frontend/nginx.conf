server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: permite recargar rutas de React Router sin dar 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia la API .NET en la red interna de Docker
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Redirige /pgadmin -> /pgadmin/
    location = /pgadmin {
        return 301 /pgadmin/;
    }

    # Proxy hacia pgAdmin bajo la subruta /pgadmin (sin barra final en proxy_pass para conservar /pgadmin)
    location /pgadmin/ {
        proxy_pass http://pgadmin:80;
        proxy_http_version 1.1;
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
